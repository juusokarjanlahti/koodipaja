name: App

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md", "CLAUDE.md"]
  pull_request:
    paths-ignore: ["docs/**", "README.md", "CLAUDE.md"]
  # The full check every night, so a regression a fast PR run skipped is found by morning.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# A newer push to the same PR replaces the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: koodipaja
          POSTGRES_USER: koodipaja
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U koodipaja" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://koodipaja:ci@localhost:5432/koodipaja
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run db:migrate
      - run: npm run import-exercises
      - run: npm run build

  smoke:
    # End-to-end against a real go-judge sandbox (ADR 0006): every exercise in every
    # language, sandbox security probes, smoke test and Playwright user flows.
    # Runs alongside "test" instead of after it: a PR waits for the slower job only.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: koodipaja
          POSTGRES_USER: koodipaja
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U koodipaja" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://koodipaja:ci@localhost:5432/koodipaja
      REDIS_URL: redis://localhost:6379
      RUNNER: go-judge
      SESSION_SECRET: ci-secret-0123456789abcdef0123456789abcdef0123456789abcdef
      DEV_LOGIN: "true"
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Fast mode for pull requests that touch neither exercises nor the code that runs and
      # grades them: runner-check and smoke take one exercise per language instead of all
      # (CHECK_SCOPE=sample). Sandbox security probes and Playwright always run in full.
      # main and the nightly run always check everything.
      - name: Choose check scope
        working-directory: .
        run: |
          scope=full
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
            heavy='^(exercises/|concepts/|infra/|docker-compose\.yml|scripts/|app/src/lib/(runner|grading|runs|exercises)/|app/scripts/|app/package-lock\.json|\.github/workflows/)'
            if ! printf '%s\n' "$changed" | grep -Eq "$heavy"; then scope=sample; fi
          fi
          echo "CHECK_SCOPE=$scope" >> "$GITHUB_ENV"
          echo "::notice title=check scope::$scope"
      # Toolchains for every exercise language; go-judge mounts them read-only (ADR 0006).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Start go-judge sandbox
        run: |
          # cgroup v2 memory limits do not cover swap (ADR 0006), so turn swap off.
          sudo swapoff -a
          sudo env "PATH=$PATH" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            ../infra/go-judge/dev.sh > "$RUNNER_TEMP/go-judge.log" 2>&1 &
          for i in $(seq 1 90); do curl -fs -H "Authorization: Bearer localtoken" localhost:5050/version && break; sleep 1; done
          ../infra/go-judge/dev.sh --print-env >> "$GITHUB_ENV"
      - run: npm run db:migrate
      - run: npm run import-exercises
      - run: npm run runner-check
      # Throwaway tool key for the LTI e2e tests (grade passback signs with it).
      - run: echo "LTI_PRIVATE_KEY=$(npm run --silent lti:keygen -- --value)" >> "$GITHUB_ENV"
      - run: |
          npm run worker &
          npx next dev -p 3000 &
          for i in $(seq 1 90); do curl -fs localhost:3000/login >/dev/null && break; sleep 1; done
      # next dev compiles each page on its first request; doing it now keeps that time out of
      # the Playwright timeouts (it was the main source of flaky runs).
      - name: Warm up pages
        run: |
          for p in / /exercises/01-tervehdys /muistilista /ohje /opettaja /lti-virhe /lti-valitse /login; do
            curl -s -o /dev/null -w "%{http_code} $p\n" "localhost:3000$p" || true
          done
      - run: npm run smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        run: |
          sudo tail -n 80 "$RUNNER_TEMP/go-judge.log" || true
          log="$(sudo grep -iE 'cgroup|fallback|error|warn|fatal' "$RUNNER_TEMP/go-judge.log" 2>/dev/null | tail -n 25 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          echo "::warning title=go-judge log::${log:-empty}"
          echo "::warning title=cgroup::$(stat -fc %T /sys/fs/cgroup) $(uname -r) $(id -u)"
          echo "::warning title=go-judge config::$(curl -s -H 'Authorization: Bearer localtoken' localhost:5050/config | head -c 400)"
