name: Validate exercises

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR replaces the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Compilers for every exercise language (ADR 0005). GCC is preinstalled.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # TypeScript exercises compile with the app's pinned tsc and @types/node.
      - run: npm ci
        working-directory: app
      - run: pip install pyyaml
      - run: python3 scripts/validate.py
      # The CodeRunner export must produce well-formed Moodle XML for every exportable exercise.
      - run: |
          python3 scripts/export_coderunner.py -o "$RUNNER_TEMP/koodipaja.xml" --answers "$RUNNER_TEMP/answers.json"
          python3 - "$RUNNER_TEMP/koodipaja.xml" <<'PY'
          import sys, xml.dom.minidom
          doc = xml.dom.minidom.parse(sys.argv[1])
          n = sum(q.getAttribute("type") == "coderunner" for q in doc.getElementsByTagName("question"))
          assert n > 0, "no CodeRunner questions exported"
          print(f"{n} CodeRunner questions, XML well-formed")
          PY
