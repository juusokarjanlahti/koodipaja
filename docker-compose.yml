# Infrastructure for Koodipaja.
#
#   cp .env.example .env
#   docker compose up -d                     # Postgres, Redis and the go-judge sandbox
#
# The app (app/) runs on the host with `npm run dev` and `npm run worker`.
#
# Code runs in go-judge (ADR 0006). It sits on its own network, so code running in the
# sandbox can never reach app data; each run also gets its own network namespace with no
# network at all. For a sandbox without Docker see infra/go-judge/dev.sh.
#
# Legacy Judge0 (ADR 0005, replaced by ADR 0006) is still available behind a profile:
#   cp infra/judge0.conf.example infra/judge0.conf
#   docker compose --profile judge0 up -d     # and set RUNNER=judge0

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-koodipaja}
      POSTGRES_USER: ${POSTGRES_USER:-koodipaja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app]

  go-judge:
    build: ./infra/go-judge
    restart: unless-stopped
    # go-judge creates namespaces and cgroups for every run.
    privileged: true
    shm_size: 512m
    environment:
      GO_JUDGE_AUTH_TOKEN: ${GO_JUDGE_AUTH_TOKEN:?set GO_JUDGE_AUTH_TOKEN in .env}
    ports:
      - "127.0.0.1:5050:5050"
    networks: [sandbox]

  judge0-server:
    profiles: [judge0]
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    privileged: true
    volumes:
      - ./infra/judge0.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    networks: [judge0]

  judge0-workers:
    profiles: [judge0]
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    command: ["./scripts/workers"]
    privileged: true
    volumes:
      - ./infra/judge0.conf:/judge0.conf:ro
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    networks: [judge0]

  judge0-db:
    profiles: [judge0]
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./infra/judge0.conf
    volumes:
      - judge0-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [judge0]

  judge0-redis:
    profiles: [judge0]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    env_file: ./infra/judge0.conf
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [judge0]

networks:
  app:
  sandbox:
  judge0:

volumes:
  db-data:
  redis-data:
  judge0-db-data:
