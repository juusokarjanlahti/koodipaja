id: 03-kahden-luvun-summa
title: Kahden luvun summa
language: python
difficulty: 1
level: perus
scaffold: full
concepts: [input, tyyppimuunnos, print]
requires: [f-merkkijono]
topics: [syöte, tietotyypit]
time_limit_seconds: 2
memory_limit_mb: 64
cases:
  - name: Pienet luvut
    stdin: "3\n4\n"
    expected_stdout: "Summa: 7\n"
  - name: Nolla
    stdin: "0\n5\n"
    expected_stdout: "Summa: 5\n"
  - name: Negatiivinen
    stdin: "-8\n3\n"
    expected_stdout: "Summa: -5\n"
  - name: Suuret luvut
    stdin: "123456\n654321\n"
    expected_stdout: "Summa: 777777\n"
    hidden: true
