id: 09-lahtolaskenta
title: Lähtölaskenta
language: python
difficulty: 2
level: perus
scaffold: outline
concepts: [while]
requires: [print, input, tyyppimuunnos]
topics: [silmukat]
time_limit_seconds: 2
memory_limit_mb: 64
cases:
  - name: Kolmesta
    stdin: "3\n"
    expected_stdout: "3\n2\n1\nLähtö!\n"
  - name: Ykkösestä
    stdin: "1\n"
    expected_stdout: "1\nLähtö!\n"
  - name: Nollasta
    stdin: "0\n"
    expected_stdout: "Lähtö!\n"
  - name: Viidestä
    stdin: "5\n"
    expected_stdout: "5\n4\n3\n2\n1\nLähtö!\n"
  - name: Negatiivinen
    stdin: "-2\n"
    expected_stdout: "Lähtö!\n"
    hidden: true
