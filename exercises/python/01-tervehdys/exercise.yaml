    stdin: "Matti\n"
    expected_stdout: "Mikä on nimesi?\nHei, Matti!\n"
  - name: Välilyönti nimessä
    stdin: "Anna Liisa\n"
    expected_stdout: "Mikä on nimesi?\nHei, Anna Liisa!\n"
  - name: Ääkköset
    stdin: "Väinö\n"
    expected_stdout: "Mikä on nimesi?\nHei, Väinö!\n"
    hidden: true
