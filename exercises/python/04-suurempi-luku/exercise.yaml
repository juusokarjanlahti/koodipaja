id: 04-suurempi-luku
title: Suurempi luku
language: python
difficulty: 1
level: perus
scaffold: full
concepts: [if, tyyppimuunnos]
topics: [ehdot, tietotyypit]
time_limit_seconds: 2
memory_limit_mb: 64
cases:
  - name: Toinen suurempi
    stdin: "3\n5\n"
    expected_stdout: "Suurempi luku on 5\n"
  - name: Ensimmäinen suurempi
    stdin: "9\n2\n"
    expected_stdout: "Suurempi luku on 9\n"
  - name: Yhtä suuret
    stdin: "4\n4\n"
    expected_stdout: "Luvut ovat yhtä suuret\n"
  - name: Kaksinumeroinen
    stdin: "10\n9\n"
    expected_stdout: "Suurempi luku on 10\n"
  - name: Negatiiviset
    stdin: "-3\n-7\n"
    expected_stdout: "Suurempi luku on -3\n"
    hidden: true
